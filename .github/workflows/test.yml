name: Cloud build
on:
  workflow_dispatch:
concurrency:
  group: neardrop-cloud-build
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -o neardrop-linux-amd64 ./cmd/neardrop
      - uses: actions/upload-artifact@v4
        with:
          name: neardrop-linux-amd64
          path: neardrop-linux-amd64
          retention-days: 3
  iphone:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Build iPhone app and Share extension
        run: xcodebuild -project ios/NearDrop.xcodeproj -scheme NearDrop -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build
      - name: Run Swift tests
        shell: bash
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,items in d["devices"].items() if "iOS-26" in runtime for x in items if "iPhone" in x["name"]))')
          xcodebuild -project ios/NearDrop.xcodeproj -scheme NearDrop -destination "platform=iOS Simulator,id=$device" -derivedDataPath build/simulator -resultBundlePath build/TestResults.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Build iPhone IPA for local signing
        run: |
          xcodebuild -project ios/NearDrop.xcodeproj -scheme NearDrop -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build
          python3 scripts/package-ipa.py build/device/Build/Products/Release-iphoneos/NearDrop.app build/NearDrop-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: NearDrop-iPhone-unsigned
          path: build/NearDrop-unsigned.ipa
          retention-days: 3
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-test-results
          path: build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 3
